name: Publish gold rates

on:
  schedule:
    # IBJA publishes at about 12:10 and 18:10 IST. Run a little after each.
    # 07:15 UTC = 12:45 IST, 13:15 UTC = 18:45 IST.
    # Monday to Saturday: IBJA has a Saturday session, and a weekday-only
    # schedule left it unread until the following Monday.
    - cron: "15 7 * * 1-6"
    - cron: "15 13 * * 1-6"
  workflow_dispatch:
    inputs:
      keep_raw:
        description: "Upload the fetched page as an artifact (for debugging)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Without this the checkout is detached at a SHA, and a detached
          # HEAD cannot be pushed: the commit is made and then thrown away,
          # which is exactly how a run can report a rate it never published.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and validate
        id: run
        env:
          KEEP_RAW: ${{ inputs.keep_raw && '1' || '0' }}
          # The key lives here and nowhere else. It never enters the app, the
          # published JSON, or a log line: the script describes an API failure
          # by its HTTP status rather than by echoing the URL it called.
          METALS_DEV_KEY: ${{ secrets.METALS_DEV_KEY }}
        run: python scripts/fetch_gold.py

      - name: Commit if changed
        run: |
          # --porcelain rather than `git diff`, because on the very first run
          # a file is untracked and `git diff` reports nothing to do.
          # quota.json is included: the call counter is only a ceiling if it
          # survives to the next run, and the repository is where it lives.
          if [ -z "$(git status --porcelain -- docs/gold.json docs/gold_scrape.json docs/quota.json)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add docs/gold.json docs/gold_scrape.json docs/quota.json
          git commit -m "gold: $(date -u +%Y-%m-%dT%H:%MZ)"
          # The scheduled run and a manual run can land together; rebase
          # rather than fail, since both are writing the same few files.
          # Branch named explicitly on both, so neither depends on the
          # checkout having left an upstream configured.
          git pull --rebase --quiet origin main
          git push origin HEAD:main

      - name: Publish the page for inspection
        # Committed to a throwaway branch rather than uploaded as an artifact,
        # because an artifact can only be read through a storage host that is
        # not always reachable. This branch is never merged and is overwritten
        # on every debug run.
        # Runs last, and deliberately so. It ends by checking the tree back
        # out, which discards anything written but not yet committed -- when
        # it ran first it quietly threw away the very gold.json the run had
        # just produced, and the run still reported success.
        if: always() && inputs.keep_raw
        run: |
          test -f raw.html || exit 0
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git checkout --orphan debug-raw
          git rm -rq --cached . || true
          git add -f raw.html
          git commit -m "raw page $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin debug-raw
          git checkout -f "$GITHUB_SHA"
