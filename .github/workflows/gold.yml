name: Publish gold rates

on:
  schedule:
    # IBJA publishes at about 12:10 and 18:10 IST. Run a little after each.
    # 07:15 UTC = 12:45 IST, 13:15 UTC = 18:45 IST. Weekdays only.
    - cron: "15 7 * * 1-5"
    - cron: "15 13 * * 1-5"
  workflow_dispatch:
    inputs:
      keep_raw:
        description: "Upload the fetched page as an artifact (for debugging)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and validate
        id: run
        env:
          KEEP_RAW: ${{ inputs.keep_raw && '1' || '0' }}
        run: python scripts/fetch_gold.py

      - name: Upload the page for inspection
        if: always() && inputs.keep_raw
        uses: actions/upload-artifact@v4
        with:
          name: raw-page
          path: raw.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit if changed
        run: |
          rm -f raw.html
          if git diff --quiet -- docs/gold.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add docs/gold.json
          git commit -m "gold: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
